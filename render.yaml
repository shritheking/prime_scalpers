services:
  - type: web
    name: prime-scalpers-bot
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHANNEL_ID
        value: -1003957867906
      - key: ADMIN_TELEGRAM_IDS
        value: 5188160752
      - key: QUOTEX_AFFILIATE_LINK
        value: https://broker-qx.pro/?lid=2414647
      - key: QUOTEX_AFFILIATE_LINK_ID
        value: 2414647
      - key: MINIMUM_DEPOSIT
        value: 100
      - key: QUOTEX_VERIFICATION_PROVIDER
        value: mtproto
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: TELEGRAM_SESSION_STRING
        sync: false
      - key: QUOTEX_PARTNER_BOT_USERNAME
        value: QuotexPartnerBot
      - key: AUTO_VERIFICATION_ENABLED
        value: "true"
      - key: AUTO_RETRY_INTERVAL_MINUTES
        value: "15"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
